# Upptime configuration for the public status page. Decision record:
# https://github.com/IP-Attorney-Hub/ipah/blob/main/docs/software-design/status-page.md
# Docs: https://upptime.js.org/docs/configuration
#
# The workflows take their token from the attorneyhub-automation GitHub App, never a personal
# access token: the repository variable GH_APP_ID holds the App's client id, and the repository
# secret GH_APP_PRIVATE_KEY holds its private key. Do not add a GH_PAT secret.
owner: IP-Attorney-Hub
repo: status

# The public components, and the checks below that decide each one's status (ipah#6955). A check
# is a "site" to Upptime, and each site is one row on the page.
#
# | Component                         | Depends on                    | Decided by                         |
# | --------------------------------- | ----------------------------- | ---------------------------------- |
# | Web app                           | CloudFront + S3               | Web app (3 regions)                |
# | Sign-in                           | API auth endpoints            | Sign-in                            |
# | Proposals and work agreements     | API + Postgres + S3           | API (3 regions), API dependencies  |
# | Documents                         | API + Postgres + S3           | API (3 regions), API dependencies  |
# | Messaging and realtime            | API + Ably                    | API (3 regions), API dependencies  |
# | AI assistant, Document search     | API + RAG + model provider    | API (3 regions), API dependencies  |
# | Email notifications               | SES                           | No outside check; alarms (#6956)   |
#
# - The RAG service has no public address (rag.attorneyhub.com resolves inside the VPC), so no
#   outside check can reach it. The API's /health/ready asks it, along with Postgres and Ably.
# - /health/ready answers 503 when a dependency is down. That is "degraded", not "down": the API
#   itself is up, and its /health decides "down". So 503 is an expected status, and the body rule
#   marks the row degraded.
# - Globalping runs the GET checks from three continents (type: globalping). It cannot send a POST,
#   so the sign-in check runs from GitHub's runner. Nine Globalping checks every 5 minutes is 108
#   measurements an hour; an anonymous runner may make 250, and the IP is shared, so the optional
#   GLOBALPING_TOKEN secret raises the limit to 500.

# The sign-in check's synthetic user. The API creates it from its own Secrets Manager secret
# (attorneyhub-production-status-probe-password), in a legal entity of its own with no access to
# any customer's data. Listing them here makes them the only secrets a check may substitute.
secrets:
  - STATUS_PROBE_EMAIL
  - STATUS_PROBE_PASSWORD

sites:
  # Web app: index.html must name the app bundle, so a page that answers 200 without the
  # application (an error page, an empty bucket) still counts as down.
  - name: Web app (North America)
    url: https://www.attorneyhub.com/
    type: globalping
    location: North America
    __dangerous__body_down_if_text_missing: 'src="/assets/index-'
  - name: Web app (Europe)
    url: https://www.attorneyhub.com/
    type: globalping
    location: Europe
    __dangerous__body_down_if_text_missing: 'src="/assets/index-'
  - name: Web app (Asia)
    url: https://www.attorneyhub.com/
    type: globalping
    location: Asia
    __dangerous__body_down_if_text_missing: 'src="/assets/index-'

  # API: the load balancer's own health endpoint, reached through DNS and TLS as a customer does.
  - name: API (North America)
    url: https://api.attorneyhub.com/health
    type: globalping
    location: North America
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: '"status":"Healthy"'
  - name: API (Europe)
    url: https://api.attorneyhub.com/health
    type: globalping
    location: Europe
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: '"status":"Healthy"'
  - name: API (Asia)
    url: https://api.attorneyhub.com/health
    type: globalping
    location: Asia
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: '"status":"Healthy"'

  # API dependencies: Postgres, Ably and the RAG service, as the API sees them. Degraded, never
  # down, on failure.
  - name: API dependencies (North America)
    url: https://api.attorneyhub.com/health/ready
    type: globalping
    location: North America
    expectedStatusCodes:
      - 200
      - 503
    __dangerous__body_degraded_if_text_missing: '"status":"Healthy"'
  - name: API dependencies (Europe)
    url: https://api.attorneyhub.com/health/ready
    type: globalping
    location: Europe
    expectedStatusCodes:
      - 200
      - 503
    __dangerous__body_degraded_if_text_missing: '"status":"Healthy"'
  - name: API dependencies (Asia)
    url: https://api.attorneyhub.com/health/ready
    type: globalping
    location: Asia
    expectedStatusCodes:
      - 200
      - 503
    __dangerous__body_degraded_if_text_missing: '"status":"Healthy"'

  # Sign-in: the synthetic user signs in, and the answer must carry a token.
  - name: Sign-in
    url: https://api.attorneyhub.com/users/login
    method: POST
    headers:
      - "Content-Type: application/json"
      - "Accept: application/json"
    body: '{"email":"$STATUS_PROBE_EMAIL","password":"$STATUS_PROBE_PASSWORD"}'
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: '"authToken":{"value":"'

# Upptime opens an incident issue when a check fails and assigns it to these people.
# The members of the IP-Attorney-Hub "admins" team on 2026-10-28.
assignees:
  - bradford281
  - atowler84

workflowSchedule:
  uptime: "*/5 * * * *"

status-website:
  # The status.attorneyhub.com CNAME to ip-attorney-hub.github.io lives in ipah's
  # terraform/route53_dns.tf (ipah#6958).
  cname: status.attorneyhub.com
  name: Attorney Hub Status
  introTitle: "Attorney Hub status"
  introMessage: The current status of Attorney Hub, checked every 5 minutes from outside our cloud.
  # Regions is a static page, assets/regions/, which rolls each region up across the systems
  # checked there (ipah#6959). Upptime has no setting for it, and copies assets/ onto the site
  # unchanged, so a template update leaves it alone. Its own navigation mirrors this list.
  navbar:
    - title: Status
      href: /
    - title: Regions
      href: /regions/
    - title: Attorney Hub
      href: https://www.attorneyhub.com
    - title: Support
      href: mailto:support@attorneyhub.com
  # Branding (ipah#6958). The logo, favicons and colors are the app's own: the logo and favicon are
  # copies of ipah's app/src/_shared/_views/assets/attorney-hub-logo-alt.svg and app/public/
  # favicon.svg and logo192.png, and the colors are the navy and gold of its MUI theme
  # (app/src/_shared/_views/theme/attorney-hub-theme-options.ts). assets/ is copied over the built
  # site, so assets/logo-192.png replaces Upptime's own PNG favicon, which the Regions page uses too.
  # Absolute URLs: the site export crawls a root-relative one as a page and leaves a directory of
  # that name, which the copy of assets/ then cannot overwrite.
  logoUrl: https://status.attorneyhub.com/attorney-hub-logo.svg
  # The logo spells out "Attorney Hub", so the name beside it would repeat it.
  hideNavTitle: true
  faviconSvg: https://status.attorneyhub.com/favicon.svg
  # The page keeps Upptime's light and dark themes, which the Regions page shares, and overrides only
  # their accent colors. The logo is a single dark ink, so dark mode draws it white.
  css: >-
    :root { --nav-current-border-bottom-color: #E19941; --error-button-border-color: #1F3A5F;
    --error-button-background-color: #1F3A5F; --submit-button-border-color: #1F3A5F;
    --submit-button-background-color: #1F3A5F; }
    @media (prefers-color-scheme: light) { :root { --body-text-color: #1B2333;
    --body-background-color: #F5F6F8; --nav-border-bottom-color: #DDE1E7;
    --card-border-color: #DDE1E7; } }
    nav .logo img { height: 2rem; width: auto; }
    @media (prefers-color-scheme: dark) { nav .logo img { filter: brightness(0) invert(1); } }
